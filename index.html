<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReagentDex</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>


<header>
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">⚗</span>
        <span class="logo-text">ReagentDex</span>
      </div>
      <p class="tagline">Reference for Organic Chemistry Reagents</p>
    </div>
    <div class="header-bg-lines"></div>
</header>


<main id="home-view" class="view active">
    <div class="section-label">// Select a Topic</div>
    <div class="card-grid" id="topic-grid">
  
    </div>
</main>

 
<main id="list-view" class="view">
    <div class="breadcrumb">
      <button class="back-btn" id="back-to-home">← Topics</button>
      <span class="breadcrumb-sep">/</span>
      <span id="list-topic-name"></span>
    </div>
    <div class="section-label">// Reagents</div>
    <div class="reagent-list" id="reagent-list">
  
    </div>

</main>


<main id="detail-view" class="view">
    <div class="breadcrumb">
      <button class="back-btn" id="back-to-list">← Reagents</button>
      <span class="breadcrumb-sep">/</span>
      <span id="detail-topic-name"></span>
      <span class="breadcrumb-sep">/</span>
      <span id="detail-reagent-name"></span>
    </div>



<div class="detail-card">
      <div class="detail-header">
        <div class="detail-icon">⚗</div>
        <div>
          <h2 id="detail-title"></h2>
          <p id="detail-subtitle" class="detail-subtitle"></p>
        </div>
      </div>


      <div class="detail-body">
        <div class="detail-section" id="detail-uses-section">
          <h3>Uses / Reactions</h3>
          <ul id="detail-uses"></ul>
        </div>


        <div class="detail-section" id="detail-notes-section">
          <h3>Important Info</h3>
          <p id="detail-notes"></p>
        </div>


        <div class="detail-section" id="detail-examples-section">
          <h3>Examples</h3>
          <ul id="detail-examples"></ul>
        </div>
    </div>

    </div>
  </main>


  <script src="Reagentdata.js"></script>
  <script src="script.js"></script>
</body>
</html>
