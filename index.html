<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReagentDex</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>


<header>
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">⚗</span>
        <span class="logo-text">ReagentDex</span>
      </div>
      <p class="tagline">Reference for Organic Chemistry Reagents</p>
    </div>
    <div class="header-bg-lines"></div>
</header>


<main id="home-view" class="view active">
    <div class="section-label">// Select a Topic</div>
    <div class="card-grid" id="topic-grid">
  
    </div>
</main>

 
<main id="list-view" class="view">
    <div class="breadcrumb">
      <button class="back-btn" id="back-to-home">← Topics</button>
      <span class="breadcrumb-sep">/</span>
      <span id="list-topic-name"></span>
    </div>
    <div class="section-label">// Reagents</div>
    <div class="reagent-list" id="reagent-list">
  
    </div>
</main>


 
  
  

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
